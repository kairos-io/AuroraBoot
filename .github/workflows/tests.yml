name: Tests
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ci-tests-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Build UI bundle (embedded via go:embed)
        run: make ui-build
      - name: Run UI tests
        run: make ui-test
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Run tests
        run: |
          sudo go run github.com/onsi/ginkgo/v2/ginkgo -v -r -p --covermode=atomic --coverprofile=coverage.out --timeout=2h --skip-package ./e2e ./...
      - name: Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.out
  helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 0.5.2
      - name: Lint chart
        run: make helm-chart-lint
      - name: Run chart unit tests
        run: make helm-chart-test
  build-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: auroraboot:ci
          outputs: type=docker,dest=/tmp/auroraboot-image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: auroraboot-image
          path: /tmp/auroraboot-image.tar
          retention-days: 1
  e2e-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # docker/setup-qemu-action runs the binfmt container on the default
      # bridge, which the self-hosted pool failed with "bridge port not
      # forwarding after 200ms" (kairos-io/kairos#4553). binfmt only writes to
      # /proc/sys/fs/binfmt_misc, so give it the host network and never create
      # a bridge port. Kept after the move to hosted runners: it costs nothing
      # here and is what makes this step portable back to a self-hosted pool.
      # Same reason as the network=host driver-opt on buildx below.
      # Pinned by digest: this step installs the emulators every cross-arch
      # build then depends on, so it must not change under us.
      # tonistiigi/binfmt:qemu-v9.2.2
      - name: Set up QEMU
        run: docker run --rm --privileged --network host docker.io/tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 --install all
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: auroraboot:test
      - name: Ensure loop device nodes
        # losetup asks the kernel for a free loop index and then opens
        # /dev/loopN. A previous step can leave the kernel index free while the
        # /dev/loopN node has been unlinked (LOOP_CTL_DEL, or a container
        # bind-mounting /dev); on the shared self-hosted pool this also leaked
        # across jobs. losetup then fails with
        # "device node /dev/loopN is lost. You may use mknod(1) to recover it."
        # Pre-create the nodes so any recycled index has a matching /dev entry.
        run: |
          sudo bash -c '
            for i in $(seq 0 15); do
              [ -e /dev/loop$i ] || mknod -m 660 /dev/loop$i b 7 $i
              chown root:disk /dev/loop$i 2>/dev/null || true
            done
          '
          ls -la /dev/loop*
      - name: Run e2e tests
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -v -r -p --covermode=atomic --coverprofile=coverage.out --timeout=2h --label-filter "e2e" ./e2e
      - name: Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.out
  test-bootable-iso-uki:
    runs-on: ubuntu-24.04
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-system-x86 qemu-utils qemu-kvm acl udev swtpm libpcsclite-dev
      - name: Grant access to /dev/kvm
        # Hosted runners expose /dev/kvm as root:kvm 0660 and the `runner` user
        # is not in that group, so qemu would silently fall back to TCG and
        # these boots would run far slower than the suite's timeouts allow.
        # setfacl on its own is not enough: installing the qemu stack above
        # triggers udev, and `udevadm trigger` is asynchronous, so the node can
        # be re-created with the packaged mode seconds after setfacl has
        # already returned 0. Install a rule that outranks the packaged one,
        # drain the udev queue, and only then fall back to the ACL.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle || true
          sudo setfacl -m u:runner:rwx /dev/kvm || true
          # Fail here rather than deep inside a boot that silently ran on TCG.
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: auroraboot-image
          path: /tmp/
      - name: Load image
        run: docker load -i /tmp/auroraboot-image.tar
      - name: Generate ISO
        run: |
          mkdir build
          docker run --rm --privileged \
          --network=host \
          -v $PWD/build/:/output \
          -v $PWD/e2e/assets/keys/:/keys \
          auroraboot:ci \
          --debug \
          build-uki \
          --output-dir /output \
          --public-keys /keys \
          --tpm-pcr-private-key /keys/tpm2-pcr-private.pem \
          --sb-key /keys/db.key \
          --sb-cert /keys/db.pem \
          --output-type iso \
          -x "console=ttyS0" \
          quay.io/kairos/ubuntu:24.04-core-amd64-generic-v3.2.3
      - name: Find OVMF firmware
        uses: ./.github/actions/find-ovmf-firmware
        id: find_ovmf
        with:
          prefer_secboot: true
      - name: Test UKI iso is bootable
        env:
          FIRMWARE: ${{ steps.find_ovmf.outputs.firmware }}
          KVM: true
          EFIVARS_EMPTY: true
        run: |
          export ISO=$(find $PWD/build -name *.iso)
          go run github.com/onsi/ginkgo/v2/ginkgo run --label-filter "bootable" -v --fail-fast -r ./e2e
  test-bootable-raw-efi:
    runs-on: ubuntu-24.04
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-system-x86 qemu-utils qemu-kvm acl udev libpcsclite-dev
      - name: Grant access to /dev/kvm
        # Hosted runners expose /dev/kvm as root:kvm 0660 and the `runner` user
        # is not in that group, so qemu would silently fall back to TCG and
        # these boots would run far slower than the suite's timeouts allow.
        # setfacl on its own is not enough: installing the qemu stack above
        # triggers udev, and `udevadm trigger` is asynchronous, so the node can
        # be re-created with the packaged mode seconds after setfacl has
        # already returned 0. Install a rule that outranks the packaged one,
        # drain the udev queue, and only then fall back to the ACL.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle || true
          sudo setfacl -m u:runner:rwx /dev/kvm || true
          # Fail here rather than deep inside a boot that silently ran on TCG.
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: auroraboot-image
          path: /tmp/
      - name: Load image
        run: docker load -i /tmp/auroraboot-image.tar
      - name: Generate raw image
        run: |
          mkdir build
          docker run --rm --privileged \
          --network=host \
          -v $PWD/build/:/output \
          auroraboot:ci \
          --debug \
          --set "disable_http_server=true" --set "disable_netboot=true" --set "state_dir=/output" \
          --set "disk.efi=true" \
          --set "disk.size=16000" \
          --set "container_image=oci://quay.io/kairos/ubuntu:24.04-core-amd64-generic-v3.2.3"
      - name: Find OVMF firmware
        uses: ./.github/actions/find-ovmf-firmware
        id: find_ovmf
      - name: Test raw image is bootable
        env:
          KVM: true
          FIRMWARE: ${{ steps.find_ovmf.outputs.firmware }}
          EFIVARS_EMPTY: true
        run: |
          export RAW_IMAGE=$(find $PWD/build -name *.raw)
          go run github.com/onsi/ginkgo/v2/ginkgo run --label-filter "raw-bootable" -v --fail-fast -r ./e2e
  test-bootable-raw-bios:
    runs-on: ubuntu-24.04
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-system-x86 qemu-utils qemu-kvm acl udev libpcsclite-dev
      - name: Grant access to /dev/kvm
        # Hosted runners expose /dev/kvm as root:kvm 0660 and the `runner` user
        # is not in that group, so qemu would silently fall back to TCG and
        # these boots would run far slower than the suite's timeouts allow.
        # setfacl on its own is not enough: installing the qemu stack above
        # triggers udev, and `udevadm trigger` is asynchronous, so the node can
        # be re-created with the packaged mode seconds after setfacl has
        # already returned 0. Install a rule that outranks the packaged one,
        # drain the udev queue, and only then fall back to the ACL.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle || true
          sudo setfacl -m u:runner:rwx /dev/kvm || true
          # Fail here rather than deep inside a boot that silently ran on TCG.
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: auroraboot-image
          path: /tmp/
      - name: Load image
        run: docker load -i /tmp/auroraboot-image.tar
      - name: Generate raw image
        run: |
          mkdir build
          docker run --rm --privileged \
          --network=host \
          -v $PWD/build/:/output \
          auroraboot:ci \
          --debug \
          --set "disable_http_server=true" --set "disable_netboot=true" --set "state_dir=/output" \
          --set "disk.bios=true" \
          --set "disk.size=16000" \
          --set "container_image=oci://quay.io/kairos/ubuntu:24.04-core-amd64-generic-v3.2.3"
      - name: Test raw image is bootable
        env:
          KVM: true
        run: |
          export RAW_IMAGE=$(find $PWD/build -name *.raw)
          go run github.com/onsi/ginkgo/v2/ginkgo run --label-filter "raw-bootable" -v --fail-fast -r ./e2e
  test-ui-builder:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
     - name: Checkout code
       uses: actions/checkout@v7
       with:
         fetch-depth: 1
     - name: Set up Docker Buildx
       id: buildx
       uses: docker/setup-buildx-action@v4
       with:
         driver-opts: network=host
     - name: Download image artifact
       uses: actions/download-artifact@v7
       with:
         name: auroraboot-image
         path: /tmp/
     - name: Load image
       run: docker load -i /tmp/auroraboot-image.tar
     - name: Cypress run
       uses: cypress-io/github-action@v7.4.4
       with:
         working-directory: e2e/web/
         start: docker run --network=host --rm auroraboot:ci web
         wait-on: 'http://localhost:8080'
         wait-on-timeout: 60
     - name: Upload Cypress screenshots
       if: always()
       continue-on-error: true
       uses: actions/upload-artifact@v7
       with:
         name: cypress-screenshots
         path: e2e/web/cypress/screenshots/
