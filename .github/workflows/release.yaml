---
name: Release binaries

"on":
  push:
    branches:
      - "test-goreleaser/**"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ci-release-${{ github.ref }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # libpcsclite is linked through cgo, so the arm64 cross build needs
      # the arm64 dev package from ubuntu-ports next to the cross compiler.
      - name: Install cross toolchain and libpcsclite
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            pkg-config \
            libpcsclite-dev \
            libpcsclite-dev:arm64

      - name: (dry-run) GoReleaser
        if: startsWith(github.ref_name, 'test-goreleaser')
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate,publish

      - name: Run GoReleaser
        if: startsWith(github.ref_name, 'test-goreleaser') != true
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
