---
name: Release binaries

"on":
  push:
    branches:
      - "test-goreleaser/**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # libpcsclite is linked through cgo, so the arm64 cross build needs
      # the arm64 dev package from ubuntu-ports next to the cross compiler.
      - name: Install cross toolchain and libpcsclite
        run: |
          set -euo pipefail
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${codename} ${codename}-updates ${codename}-security
          Components: main universe
          Architectures: arm64
          EOF
          sudo apt-get update
          # ports.ubuntu.com arm64 lags the amd64 archive on the runner and multiarch forces matching versions, so apt must downgrade libc6 and friends.
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            pkg-config \
            libpcsclite-dev \
            libpcsclite-dev:arm64

      - name: (dry-run) GoReleaser
        if: startsWith(github.ref_name, 'test-goreleaser')
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate,publish

      - name: Run GoReleaser
        if: startsWith(github.ref_name, 'test-goreleaser') != true
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksums for the attest job
        if: startsWith(github.ref_name, 'test-goreleaser') != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt
          retention-days: 1

  # Signs in its own job, so the job that runs build code never gets an OIDC token.
  attest:
    needs:
      - goreleaser
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: checksums
          path: dist

      - name: Attest build provenance of the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          # Same release as the kairos factory, so both use one signature format.
          cosign-release: "v3.1.4"

      - name: Sign checksums
        run: cosign sign-blob --yes --bundle=dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Upload the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt.sigstore.json --repo "${GITHUB_REPOSITORY}" --clobber
