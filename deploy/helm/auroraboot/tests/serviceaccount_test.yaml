suite: serviceaccount
templates:
  - serviceaccount.yaml
tests:
  - it: renders a ServiceAccount named after the release
    set:
      host: auroraboot.example.com
    release:
      name: ab
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: ab-auroraboot

  - it: is skipped when serviceAccount.create=false
    set:
      host: auroraboot.example.com
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0
