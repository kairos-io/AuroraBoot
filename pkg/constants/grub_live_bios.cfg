
search --file --set=root /boot/kernel
set default=0
set timeout=10
set timeout_style=menu

set font=($root)/boot/${grub_cpu}/loader/grub2/fonts/unicode.pf2
if [ -f ${font} ];then
    loadfont ${font}
fi

# Get model
smbios --type 4 --get-string 5 --set model
# For Thor we need to set the ignored clk and pd, otherwise devices will die during boot
if test $model == "Thor"; then
  echo "Thor device detected, setting ignored clocks and power domains and proper console output"
  set thor_options="pd_ignore_unused clk_ignore_unused console=ttyUTC0,115200 earlycon=tegra_utc,mmio32,0xc5a0000"
fi

# Add nomodeset only on x86/amd64-class arches.
# The live console, nomodeset, and extended command line placeholders are replaced at build time.
menuentry "Kairos" --class os --unrestricted {
    echo Loading kernel...
    linux ($root)/boot/kernel cdroot root=live:CDLABEL=COS_LIVE rd.live.dir=/ rd.live.squashimg=rootfs.squashfs net.ifnames=1 {{LIVE_CONSOLE}} rd.cos.disable vga=795{{NOMODESET}} install-mode selinux=0 $thor_options rd.live.overlay.overlayfs{{EXTEND_CMDLINE}}
    echo Loading initrd...
    initrd ($root)/boot/initrd
}

menuentry "Kairos (manual)" --class os --unrestricted {
    echo Loading kernel...
    linux ($root)/boot/kernel cdroot root=live:CDLABEL=COS_LIVE rd.live.dir=/ rd.live.squashimg=rootfs.squashfs net.ifnames=1 {{LIVE_CONSOLE}} rd.cos.disable vga=795{{NOMODESET}} selinux=0 $thor_options rd.live.overlay.overlayfs{{EXTEND_CMDLINE}}
