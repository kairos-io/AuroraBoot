# OSV-Scanner configuration (see https://google.github.io/osv-scanner/configuration/)

# Transitive via kairos-agent/sdk and sbctl (TPM attestation). OSV still lists
# "Fixed in N/A" for every go-attestation release, including the current v0.6.4,
# so a version bump cannot clear this. AuroraBoot does not expose attestation
# parsing.
[[IgnoredVulns]]
id = "GO-2026-5298"
ignoreUntil = 2026-11-17
reason = "Transitive go-attestation; OSV lists no patched release (Fixed in N/A) as of 2026-08-17. TPM attestation parsing in upstream deps only. Re-evaluate before expiry."

# golang.org/x/crypto/openpgp is unmaintained by design, so OSV will never list a
# patched release. Only dropping the openpgp dependency clears this, which is an
# upstream change in our transitive deps, not something a bump here can do.
[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2026-11-17
reason = "golang.org/x/crypto/openpgp is unmaintained upstream; OSV lists no patched release (Fixed in N/A). Now on x/crypto v0.55.0. Re-evaluate before expiry."
